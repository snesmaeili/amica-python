# Publishes the final `amica` release: a metadata-only pointer at `jamica`.
# Manual dispatch only -- this is a one-off, not part of the normal release
# flow, and it uploads to a *different* PyPI project than release.yml does.
name: publish amica deprecation release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm uploading to the amica project on PyPI'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'publish'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Kept out of the package directory so it cannot drift from the real one.
      - name: Supply the licence
        run: cp LICENSE packaging/amica-deprecation/LICENSE

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build packaging/amica-deprecation --outdir dist

      # The point of this release is to vacate the `amica` import namespace, so
      # that it stops colliding with the unrelated `amica-python` distribution.
      # Shipping any module here would defeat that, so fail loudly instead.
      - name: Assert the wheel ships no modules
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          stray = [n for n in names if not n.startswith("amica-0.1.1.dist-info/")]
          if stray:
              sys.exit(f"refusing to publish: wheel contains {stray}")
          print(f"{whl}: metadata only, namespace vacated")
          PY

      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: amica-deprecation-dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC) -- no API token. Needs a publisher on the
    # `amica` project configured as:
    #   repository snesmaeili/jamica, workflow deprecate-amica.yml, environment (Any).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: amica-deprecation-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
